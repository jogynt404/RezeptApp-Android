name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SHERPA_VERSION: "2.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Whisper-Bibliothek (sherpa-onnx) laden
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/sherpa-onnx.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-${SHERPA_VERSION}.aar"
          unzip -l app/libs/sherpa-onnx.aar | grep -E "classes.jar|arm64-v8a" || true
          unzip -p app/libs/sherpa-onnx.aar classes.jar > /tmp/sherpa-classes.jar
          unzip -l /tmp/sherpa-classes.jar | grep -E "OfflineRecognizer|OfflineStream|OfflineWhisper" || (echo "Kotlin-Klassen fehlen im AAR" && exit 1)

      - name: Signierschlüssel einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein KEYSTORE_BASE64-Secret, APK wird mit Debug-Schlüssel signiert"
          fi

      - name: Tests und APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -o pipefail
          gradle --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build.log

      - name: Fehler als Anmerkungen ausgeben
        if: failure()
        run: |
          # Kompilier- und Gradle-Fehler sichtbar machen (je Anmerkung max. ~60 Zeilen)
          grep -E "^e: |error:|What went wrong|Could not |FAILED|Exception|Caused by|> " build.log \
            | grep -v "^\s*at " | head -300 > errors.txt || true
          [ -s errors.txt ] || tail -120 build.log > errors.txt
          split -l 60 errors.txt part_
          for f in part_*; do
            msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Build-Fehler ${f}::${msg}"
          done

      - name: APK umbenennen
        id: apk
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/RezeptApp-v${VERSION}.apk"
          ls -lh out
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: RezeptApp-v${{ steps.apk.outputs.version }}
          path: out/*.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: RezeptApp v${{ steps.apk.outputs.version }}
          body: "APK auf dem Handy herunterladen und installieren."
          files: out/*.apk

      - name: Testberichte bei Fehler
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: berichte
          path: app/build/reports/
          if-no-files-found: ignore
